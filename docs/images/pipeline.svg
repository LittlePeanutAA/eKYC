<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="440" viewBox="0 0 1320 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="headSmall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <clipPath id="c1"><rect x="179" y="30" width="210" height="300" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="424" y="30" width="210" height="300" rx="12"/></clipPath>
    <clipPath id="c3"><rect x="669" y="30" width="210" height="300" rx="12"/></clipPath>
    <clipPath id="c4"><rect x="914" y="30" width="210" height="300" rx="12"/></clipPath>
  </defs>

  <rect width="1320" height="440" rx="16" fill="#f8fafc"/>

  <!-- ============ Input ============ -->
  <g filter="url(#shadow)">
    <rect x="24" y="80" width="120" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="49" y="100" width="70" height="116" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="58,170 98,150 110,174 70,194" fill="#a7f3d0" stroke="#059669" stroke-width="1.2"/>
  <circle cx="84" cy="208" r="3" fill="#cbd5e1"/>
  <text x="84" y="244" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Photo</text>
  <text x="84" y="262" text-anchor="middle" font-size="11.5" fill="#64748b">any angle,</text>
  <text x="84" y="276" text-anchor="middle" font-size="11.5" fill="#64748b">any background</text>

  <!-- arrows between nodes -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#head)">
    <line x1="148" y1="180" x2="174" y2="180"/>
    <line x1="393" y1="180" x2="419" y2="180"/>
    <line x1="638" y1="180" x2="664" y2="180"/>
    <line x1="883" y1="180" x2="909" y2="180"/>
    <line x1="1128" y1="180" x2="1154" y2="180"/>
  </g>

  <!-- ============ 1 · Card cropper ============ -->
  <g filter="url(#shadow)"><rect x="179" y="30" width="210" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="179" y="30" width="210" height="6" fill="#2563eb" clip-path="url(#c1)"/>
  <circle cx="203" cy="62" r="13" fill="#2563eb"/>
  <text x="203" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="223" y="67" font-size="15.5" font-weight="650" fill="#0f172a">Card cropper</text>
  <rect x="195" y="86" width="178" height="104" rx="8" fill="#eff6ff"/>
  <polygon points="209,120 259,104 269,160 217,174" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <g fill="#2563eb"><circle cx="209" cy="120" r="4"/><circle cx="259" cy="104" r="4"/><circle cx="269" cy="160" r="4"/><circle cx="217" cy="174" r="4"/></g>
  <line x1="280" y1="138" x2="298" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#headSmall)"/>
  <rect x="304" y="112" width="58" height="37" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="309" y="119" width="12" height="16" fill="#dbeafe"/>
  <g stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round"><line x1="326" y1="121" x2="355" y2="121"/><line x1="326" y1="128" x2="350" y2="128"/><line x1="326" y1="135" x2="353" y2="135"/></g>
  <text x="333" y="166" text-anchor="middle" font-size="10.5" fill="#1e40af">856 × 540</text>
  <text x="195" y="214" font-size="12.5" font-weight="600" fill="#1e293b">YOLOv8s · 4 corner classes</text>
  <text x="195" y="232" font-size="11.5" fill="#64748b">quad from box centres,</text>
  <text x="195" y="247" font-size="11.5" fill="#64748b">1 missing corner inferred,</text>
  <text x="195" y="262" font-size="11.5" fill="#64748b">perspective warp upright</text>
  <line x1="195" y1="280" x2="373" y2="280" stroke="#e2e8f0"/>
  <text x="195" y="300" font-size="10" font-weight="600" letter-spacing="0.6" fill="#94a3b8">ALTERNATIVE</text>
  <text x="195" y="316" font-size="11.5" fill="#475569">YOLOv8n-pose, 4 keypoints</text>

  <!-- ============ 2 · Field detector ============ -->
  <g filter="url(#shadow)"><rect x="424" y="30" width="210" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="424" y="30" width="210" height="6" fill="#16a34a" clip-path="url(#c2)"/>
  <circle cx="448" cy="62" r="13" fill="#16a34a"/>
  <text x="448" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="468" y="67" font-size="15.5" font-weight="650" fill="#0f172a">Field detector</text>
  <rect x="440" y="86" width="178" height="104" rx="8" fill="#f0fdf4"/>
  <rect x="452" y="96" width="154" height="84" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="460" y="112" width="34" height="50" rx="2" fill="#2563eb" opacity="0.85"/>
  <text x="477" y="141" text-anchor="middle" font-size="8.5" fill="#fff">face</text>
  <g fill="#16a34a">
    <rect x="502" y="108" width="72" height="12" rx="2"/>
    <rect x="502" y="125" width="86" height="12" rx="2"/>
    <rect x="540" y="142" width="54" height="12" rx="2"/>
    <rect x="502" y="159" width="96" height="12" rx="2"/>
  </g>
  <g font-size="8.5" fill="#fff" text-anchor="middle">
    <text x="538" y="117">id</text><text x="545" y="134">name</text><text x="567" y="151">dob</text><text x="550" y="168">hometown</text>
  </g>
  <text x="440" y="214" font-size="12.5" font-weight="600" fill="#1e293b">YOLOv8s · 5 classes</text>
  <text x="440" y="232" font-size="11.5" fill="#64748b">id, name, dob, hometown, face;</text>
  <text x="440" y="247" font-size="11.5" fill="#64748b">duplicates merged, lines put</text>
  <text x="440" y="262" font-size="11.5" fill="#64748b">in reading order</text>
  <line x1="440" y1="280" x2="618" y2="280" stroke="#e2e8f0"/>
  <text x="440" y="300" font-size="10" font-weight="600" letter-spacing="0.6" fill="#94a3b8">OUTPUT</text>
  <text x="440" y="316" font-size="11.5" fill="#475569">one crop per text line + face box</text>

  <!-- ============ 3 · Text reader ============ -->
  <g filter="url(#shadow)"><rect x="669" y="30" width="210" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="669" y="30" width="210" height="6" fill="#7c3aed" clip-path="url(#c3)"/>
  <circle cx="693" cy="62" r="13" fill="#7c3aed"/>
  <text x="693" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="713" y="67" font-size="15.5" font-weight="650" fill="#0f172a">Text reader</text>
  <rect x="685" y="86" width="178" height="104" rx="8" fill="#f5f3ff"/>
  <rect x="701" y="98" width="146" height="24" rx="3" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <g stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="710" y1="110" x2="726" y2="110"/><line x1="732" y1="110" x2="760" y2="110"/><line x1="766" y1="110" x2="790" y2="110"/><line x1="796" y1="110" x2="836" y2="110"/>
  </g>
  <line x1="774" y1="128" x2="774" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#headSmall)"/>
  <text x="774" y="167" text-anchor="middle" font-size="13" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#4c1d95">NGUYỄN VĂN A</text>
  <text x="774" y="182" text-anchor="middle" font-size="10" fill="#7c3aed">p = 0.93</text>
  <text x="685" y="214" font-size="12.5" font-weight="600" fill="#1e293b">VietOCR · VGG19-Transformer</text>
  <text x="685" y="232" font-size="11.5" fill="#64748b">all lines of a card read</text>
  <text x="685" y="247" font-size="11.5" fill="#64748b">in one batch; optional shadow</text>
  <text x="685" y="262" font-size="11.5" fill="#64748b">removal + contrast stretch</text>
  <line x1="685" y1="280" x2="863" y2="280" stroke="#e2e8f0"/>
  <text x="685" y="300" font-size="10" font-weight="600" letter-spacing="0.6" fill="#94a3b8">OUTPUT</text>
  <text x="685" y="316" font-size="11.5" fill="#475569">raw text + confidence per line</text>

  <!-- ============ 4 · Post-processing ============ -->
  <g filter="url(#shadow)"><rect x="914" y="30" width="210" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="914" y="30" width="210" height="6" fill="#ea580c" clip-path="url(#c4)"/>
  <circle cx="938" cy="62" r="13" fill="#ea580c"/>
  <text x="938" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="958" y="67" font-size="15.5" font-weight="650" fill="#0f172a">Post-processing</text>
  <rect x="930" y="86" width="178" height="104" rx="8" fill="#fff7ed"/>
  <g font-size="11.5" fill="#7c2d12">
    <circle cx="950" cy="107" r="8" fill="#ea580c"/><path d="M946,107 l3,3 l5,-6" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="966" y="111">ID: 12 or 9 digits</text>
    <circle cx="950" cy="131" r="8" fill="#ea580c"/><path d="M946,131 l3,3 l5,-6" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="966" y="135">DOB: real dd/mm/yyyy</text>
    <circle cx="950" cy="155" r="8" fill="#ea580c"/><path d="M946,155 l3,3 l5,-6" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="966" y="159">Name: UPPER CASE</text>
    <circle cx="950" cy="179" r="8" fill="#fdba74"/><text x="950" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">!</text>
    <text x="966" y="183">else → warning</text>
  </g>
  <text x="930" y="214" font-size="12.5" font-weight="600" fill="#1e293b">Rules, no model</text>
  <text x="930" y="232" font-size="11.5" fill="#64748b">normalise digits, dates,</text>
  <text x="930" y="247" font-size="11.5" fill="#64748b">case and address commas;</text>
  <text x="930" y="262" font-size="11.5" fill="#64748b">flag values that fail checks</text>
  <line x1="930" y1="280" x2="1108" y2="280" stroke="#e2e8f0"/>
  <text x="930" y="300" font-size="10" font-weight="600" letter-spacing="0.6" fill="#94a3b8">OUTPUT</text>
  <text x="930" y="316" font-size="11.5" fill="#475569">validated fields + warnings</text>

  <!-- ============ Output JSON ============ -->
  <g filter="url(#shadow)"><rect x="1159" y="80" width="137" height="200" rx="12" fill="#0f172a"/></g>
  <text x="1173" y="104" font-size="10" font-weight="600" letter-spacing="0.6" fill="#94a3b8">JSON</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <text x="1173" y="126" fill="#e2e8f0">{</text>
    <text x="1181" y="142" fill="#7dd3fc">"id"<tspan fill="#e2e8f0">: …</tspan></text>
    <text x="1181" y="158" fill="#7dd3fc">"name"<tspan fill="#e2e8f0">: …</tspan></text>
    <text x="1181" y="174" fill="#7dd3fc">"dob"<tspan fill="#e2e8f0">: …</tspan></text>
    <text x="1181" y="190" fill="#7dd3fc">"hometown"<tspan fill="#e2e8f0">:</tspan></text>
    <text x="1181" y="206" fill="#7dd3fc">"face_box"<tspan fill="#e2e8f0">:</tspan></text>
    <text x="1181" y="222" fill="#7dd3fc">"warnings"<tspan fill="#e2e8f0">:</tspan></text>
    <text x="1181" y="238" fill="#7dd3fc">"timings_ms"</text>
    <text x="1173" y="254" fill="#e2e8f0">}</text>
  </g>

  <!-- ============ Latency ============ -->
  <text x="179" y="370" font-size="11" font-weight="600" letter-spacing="0.6" fill="#64748b">CPU LATENCY · median of 10 runs, Apple M5</text>
  <text x="1124" y="370" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">334 ms total</text>
  <g font-size="11" font-weight="600" fill="#fff">
    <rect x="179" y="382" width="90" height="26" rx="4" fill="#2563eb"/>
    <text x="224" y="399" text-anchor="middle">crop 32 ms</text>
    <rect x="271" y="382" width="97" height="26" rx="4" fill="#16a34a"/>
    <text x="319" y="399" text-anchor="middle">detect 35 ms</text>
    <rect x="370" y="382" width="736" height="26" rx="4" fill="#7c3aed"/>
    <text x="738" y="399" text-anchor="middle">OCR 261 ms (4 lines)</text>
    <rect x="1108" y="382" width="16" height="26" rx="4" fill="#ea580c"/>
  </g>
</svg>
